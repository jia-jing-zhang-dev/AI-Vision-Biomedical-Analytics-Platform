name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.13.0"

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full environment, including Cellpose (needs numpy<2.1, so Python <= 3.12)
          - python-version: "3.12"
            deployment-like: false
          # Python 3.14 and requirements.txt installed the way Streamlit Cloud
          # does (uv, prebuilt wheels only), plus what the tests need
          - python-version: "3.14"
            deployment-like: true
    name: pytest (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Cellpose downloads its model from cellpose.org on first use; cache it so
      # an outage there cannot fail the tests.
      - uses: actions/cache@v6
        with:
          path: ~/.cellpose
          key: cellpose-nuclei-89ca45e4-a79107c9
      - name: Install dependencies (full)
        if: ${{ !matrix.deployment-like }}
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Install dependencies (as Streamlit Cloud does)
        if: ${{ matrix.deployment-like }}
        run: |
          pip install "uv==${{ env.UV_VERSION }}"
          uv pip install --system --only-binary :all: -r requirements.txt
          python -c "import torch; assert '+cpu' in torch.__version__, torch.__version__"
          # Guard against outdated HTTP libraries being pulled from a secondary index
          python -c "import requests, urllib3; from packaging.version import Version as V; assert V(requests.__version__) >= V('2.32') and V(urllib3.__version__) >= V('2'), (requests.__version__, urllib3.__version__)"
          pip install -r requirements-ml.txt pytest
      - name: Run tests
        run: pytest tests/ -v
